approval_policy = "on-request"
sandbox_mode = "workspace-write"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
web_search = "live"
personality = "pragmatic"

[sandbox_workspace_write]
network_access = true

[tui]
status_line = [
  "model-with-reasoning",
  "five-hour-limit",
  "weekly-limit",
  "context-remaining",
  "current-dir",
]
pet = "seedy"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

[projects."/home/berkerz/Projects/Multiplayer/ChapterGO"]
trust_level = "trusted"

[projects."/home/berkerz/dotfiles"]
trust_level = "trusted"

[projects."/home/berkerz"]
trust_level = "trusted"

[projects."/home/berkerz/Pictures/ChapterScreens"]
trust_level = "trusted"

[projects."/home/berkerz/Projects/nord-dashboard"]
trust_level = "trusted"

[projects."/home/berkerz/Projects/slacky"]
trust_level = "trusted"

[projects."/home/berkerz/Projects/hermesbox"]
trust_level = "trusted"

[projects."/home/berkerz/Documents"]
trust_level = "trusted"

[projects."/home/berkerz/Projects/contentio"]
trust_level = "trusted"

[projects."/home/berkerz/Projects/marcel"]
trust_level = "trusted"

[projects."/home/berkerz/Projects/Multiplayer"]
trust_level = "trusted"

[plugins."canva@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[notice]
hide_rate_limit_model_nudge = true

[features]
terminal_resize_reflow = true
experimental_use_rmcp_client = true

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.linear.tools.save_issue]
approval_mode = "approve"

[mcp_servers.linear.tools.save_comment]
approval_mode = "approve"
